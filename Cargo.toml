[package]
name = "ramble"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
description = "A read-only TUI markdown reader backed by markdown language servers"
license = "MIT"
authors = ["Martin Trojer <martin.trojer@gmail.com>"]

[dependencies]
anyhow = "1"
crossterm = "0.29"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
ratatui = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
syntect = { version = "5.3", default-features = false, features = ["default-fancy"] }
two-face = { version = "0.5", default-features = false, features = ["syntect-fancy"] }
unicode-width = "0.2"
unicode-segmentation = "1"

[dev-dependencies]
insta = "1"
proptest = "1"
tempfile = "3"

[profile.dev.package."*"]
opt-level = 2
