[package]
name = "ramble"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
description = "A read-only TUI markdown reader backed by markdown language servers"
license = "MIT"
authors = ["Martin Trojer <martin.trojer@gmail.com>"]
default-run = "ramble"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
crossterm = { version = "0.29", features = ["use-dev-tty"] }
lsp-types = "0.97"
notify = "8"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
ratatui = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = { version = "1", features = ["preserve_order"] }
syntect = { version = "5.3", default-features = false, features = ["default-fancy"] }
two-face = { version = "0.5", default-features = false, features = ["syntect-fancy"] }
unicode-segmentation = "1"
unicode-width = "0.2"
url = "2"
ignore = "0.4"
nucleo = "0.5"
latex-to-unicode = "0.1"
term-maths = "1"
mdroots = "0.2.4"
debrief-review = { path = "/Users/mtrojer/hacking/debrief/crates/debrief-review" }

# Scripted fake language server for tests/lsp.rs. Not a test target itself.
[[bin]]
name = "fake-lsp"
path = "tests/support/fake_lsp.rs"
test = false
doc = false

[dev-dependencies]
insta = "1"
proptest = "1"
tempfile = "3"

[profile.dev.package."*"]
opt-level = 2
