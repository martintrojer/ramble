# ramble configuration
#
# Every option is listed with its default value, commented out.
# To change one, remove the "# " in front of it and of its [section].


# ── Rendering ───────────────────────────────────────────────────────────────

# [render]

# Upper bound on the reflow width, in columns.
# max_width = 100

# The colour theme. Catppuccin Mocha is the only one; any other value is a
# config error.
# theme = "catppuccin-mocha"

# Draw LaTeX math ($…$, $$…$$, ```math) as Unicode; false shows the source.
# math = true


# ── Sidebar ─────────────────────────────────────────────────────────────────

# [sidebar]

# always | never | auto. always: shown, <leader>e hides it. never: hidden,
# <leader>e shows it. auto (peek): shown while you use it (C-w into it,
# <leader>E, :Sidebar files|outline|split), hidden again when you open a
# file, jump to a heading, go back to the text or press Esc; <leader>e pins
# it. A start with no page (a directory or no argument) always shows the
# file tree.
# show = "always"

# auto | files | outline | split (<leader>E cycles outline, files, split)
# auto: files while no page is loaded (a directory or no argument), then
# `reading` once a page is shown (a file, stdin, or a file opened later).
# default = "auto"

# outline | split: what auto shows while a page is loaded.
# reading = "outline"

# Width in columns, not counting the border. "auto" fits the rows shown
# (most of them: one very long name doesn't stretch it) within min_width
# and max_width, and grows into room the page can't use (render.max_width).
# A number is used as given.
# width = "auto"

# Lower bound for an "auto" width, in columns.
# min_width = 16

# Upper bound for an "auto" width, in columns. Also capped at 35% of the
# terminal width.
# max_width = 48

# Share of the sidebar given to files in split mode.
# split_ratio = 0.5

# Also list non-markdown files in the tree.
# show_all = false

# Hide the sidebar while the terminal is narrower than this many columns;
# it comes back when the terminal grows, unless you hid it. 0 disables.
# auto_hide_below = 80

# left | right: the screen edge the sidebar sits at (:Sidebar left|right
# switches it). C-w h / C-h and C-w l / C-l follow the screen: on the
# right, C-l goes to the sidebar.
# side = "left"


# ── Keys ────────────────────────────────────────────────────────────────────

# [keys]

# The leader key.
# leader = " "

# After a pause in a key sequence, show the keys that can come next.
# clue = true

# C-h / C-j / C-k / C-l move between panes as C-w h/j/k/l do; at the edge,
# inside tmux, they move to the tmux pane there. false unbinds them (the
# C-w keys stay).
# pane_nav = true


# ── Mouse ───────────────────────────────────────────────────────────────────

# [mouse]

# Click, double-click, drag to copy, wheel. Shift+drag still makes a native
# terminal selection; false leaves the mouse to the terminal/tmux.
# enabled = true


# ── Review comments ─────────────────────────────────────────────────────────

# [review]

# Comments on source lines, kept in debrief-review's batch for the repo.
# Comment mode (c, cc) and markers; comments go to debrief-review's batch.
# enabled = true

# Tab in the comment box cycles untyped -> kinds in order -> untyped.
# A typed comment exports as "## Item N [ISSUE]", with a legend of the
# kinds used and their definitions. A list replaces the built-ins below
# (ids are lowercased); `kinds = []` leaves every comment untyped.
# kinds = [
#   { id = "issue", definition = "Something is wrong. Fix it." },
#   { id = "suggestion", definition = "A better way to do it. Apply it, or say in your reply why not." },
#   { id = "question", definition = "The reviewer wants an answer. Answer in your reply; change code only if the answer shows a problem." },
#   { id = "nit", definition = "Minor or cosmetic. Fix it if it's cheap." },
# ]


# ── Sending the batch ───────────────────────────────────────────────────────

# [send]

# <leader>rr sends the batch: the markdown goes to `command` on stdin (with
# DEBRIEF_ROOT set). An empty command, a failure, or a 10 s timeout copies
# it to the clipboard instead. Either way the batch is then cleared.
# `preamble` replaces the export's opening paragraph ("" drops it).
# For example:
#   command = ["sh", "-c", "mu agent send worker-1 \"$(cat)\""]
#   preamble = "Please address these review comments."
# command = []


# ── Language servers ────────────────────────────────────────────────────────

# Optional. With none configured, every page uses the built-in mdroots
# backend: links, backlinks, notes, search and tags need no external tools.
# Servers are tried in order; the first whose root marker is found above the
# file serves that page, other pages stay on mdroots.
#
# kind: zk | marksman | generic (generic gets standard LSP requests only).
# position_encoding: "utf-8" | "utf-16" | "utf-32". It defaults to utf-32
# for zk; set it to override.
#
# For example:
#   [[lsp.server]]
#   kind = "zk"
#   command = ["zk", "lsp"]
#   root_markers = [".zk"]
#
#   [[lsp.server]]
#   kind = "marksman"
#   command = ["marksman", "server"]
#   root_markers = [".marksman.toml", ".git"]


# ── Launchers ───────────────────────────────────────────────────────────────

# Run a command in the terminal, then reload the page.
#
# Variables (substituted per argument, no shell): ${file} ${line} ${dir}
# ${vcs_root} ${editor}.
#
# An entry with the same name replaces a default; new names are added;
# `disabled = true` removes a default. For example:
#   [[launch]]
#   name = "edit"
#   disabled = true

# [[launch]]
# name = "edit"
# key = "<leader>o"
# command = ["${editor}", "+${line}", "${file}"]
